<!-- Popup: app em fase de teste — inscrição de testadores -->
<div id="play-store-modal" class="hidden fixed inset-0 z-[60] items-center justify-center bg-black/60 backdrop-blur-sm p-4">
  <div class="relative w-full max-w-md bg-bg-surface border border-border-subtle rounded-2xl p-6 sm:p-8">
    <button type="button" id="modal-close" aria-label="Fechar" class="absolute top-4 right-4 text-text-muted hover:text-text-primary">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>

    <span class="inline-flex items-center gap-2 font-mono text-xs uppercase tracking-wide text-amber mb-3">
      <span class="w-1.5 h-1.5 rounded-full bg-amber"></span>
      Fase de teste
    </span>
    <h3 class="font-display font-bold text-xl mb-2">O app ainda não está na Play Store</h3>
    <p class="text-text-muted text-sm mb-6">Minha Turma AO está em fase de testes fechados. Se quiseres experimentar antes do lançamento oficial, deixa o teu email do Google e o teu WhatsApp — eu adiciono-te à lista de testadores e aviso-te assim que tiveres acesso.</p>

    <form id="tester-form" action="https://formsubmit.co/contacto.meugomes@gmail.com" method="POST" novalidate>
      <input type="hidden" name="_subject" value="Novo pedido de testador — Gestor Financeiro">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="app" value="Gestor Financeiro">

      <div class="mb-4">
        <label for="tester-email" class="block text-xs text-text-muted mb-1.5">Email do Google (o mesmo da tua conta Play Store)</label>
        <input type="email" id="tester-email" name="email_google" required placeholder="o-teu@gmail.com" class="w-full bg-bg-elevated border border-border-subtle rounded-[10px] px-3.5 py-3 text-sm text-text-primary focus:border-teal focus:outline-none">
      </div>
      <div class="mb-5">
        <label for="tester-whatsapp" class="block text-xs text-text-muted mb-1.5">Número de WhatsApp</label>
        <input type="tel" id="tester-whatsapp" name="whatsapp" required placeholder="+244 9XX XXX XXX" class="w-full bg-bg-elevated border border-border-subtle rounded-[10px] px-3.5 py-3 text-sm text-text-primary focus:border-teal focus:outline-none">
      </div>

      <button type="submit" class="w-full px-6 py-3.5 rounded-[10px] bg-amber text-[#1a1200] font-semibold text-sm hover:bg-[#ffc04d] transition-colors">Quero ser testador</button>
      <p id="tester-status" class="mt-3 text-sm" role="status"></p>
    </form>
  </div>
</div>
